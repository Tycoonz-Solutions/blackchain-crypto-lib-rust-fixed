[package]
name = "blackchain-crypto-lib-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
alloy-rlp = "0.3.13"
alloy-primitives = "1"

[dependencies.blackchain-crypto-lib-rust]
path = ".."

# ── Original targets ────────────────────────────────────────────────────────

[[bin]]
name = "fuzz_tx_decode"
path = "fuzz_targets/fuzz_tx_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pubkey_parse"
path = "fuzz_targets/fuzz_pubkey_parse.rs"
test = false
doc = false
bench = false

# ── New production-grade targets ────────────────────────────────────────────

[[bin]]
name = "fuzz_composite_sig_verify"
path = "fuzz_targets/fuzz_composite_sig_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tx_sign_recover"
path = "fuzz_targets/fuzz_tx_sign_recover.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mnemonic_seed"
path = "fuzz_targets/fuzz_mnemonic_seed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_signature_hash"
path = "fuzz_targets/fuzz_signature_hash.rs"
test = false
doc = false
bench = false
