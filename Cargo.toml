[package]
name = "blackchain-crypto-lib-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.5.7", features = ["rlp", "serde"] }
alloy-rlp = "0.3.13"
bip39 = "2.2.2"
ed448-rust = "0.1.1"
getrandom = "0.4.2"
p521 = "0.13.3"
pqcrypto = "0.16"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3.5"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
sha3 = "0.10.8"
thiserror = "2.0.18"
zeroize = "1.8.2"
